# Single active Logstash Beats pipeline template.
#
# Important:
# Logstash loads all .conf files inside /etc/logstash/conf.d/.
# Keep only one Beats input pipeline active on port 5044.
#
# Disable old duplicate configs by renaming them, for example:
#
#   sudo mv /etc/logstash/conf.d/winlogbeat.conf /etc/logstash/conf.d/winlogbeat.conf.disabled
#
# This prevents duplicate indexing and keeps Winlogbeat logs routed consistently
# to the UEBA project raw telemetry index.

input {
  beats {
    port => 5044
  }
}

filter {
  if [agent][type] == "filebeat" {
    mutate {
      add_field => { "[@metadata][target_index]" => "nginx-logs-%{+YYYY.MM.dd}" }
    }
  } else if [agent][type] == "winlogbeat" {
    mutate {
      add_field => { "[@metadata][target_index]" => "winlogbeat-whatever" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][target_index]" => "unknown-beats-%{+YYYY.MM.dd}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://<ELASTICSEARCH_HOST>:9200"]
    user => "<ELASTIC_USERNAME>"
    password => "<ELASTIC_PASSWORD>"
    ssl_enabled => true
    ssl_verification_mode => "none"
    index => "%{[@metadata][target_index]}"
  }
}